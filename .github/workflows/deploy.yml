# ============================================================================
# deploy-kit · 通用发布流程（reusable workflow）
#
# 各项目在自己的 .github/workflows/deploy.yml 里这样调用：
#
#   jobs:
#     deploy:
#       uses: fmd99833125/deploy-kit/.github/workflows/deploy.yml@v1
#       with:
#         project: xuexu          # 对应服务器 projects.d/<project>.env
#         web_dir: web            # 前端源码目录
#         api_image: xuexu-api    # 后端镜像名；留空 = 本项目没有后端镜像
#         api_dockerfile: deploy/Dockerfile.api
#         image_context: .
#       secrets: inherit
#
# 流程：构建前端 → 打包 → 构建镜像 → 上传 → 触发服务器原子发布
# 服务器**不构建**，只负责取货、切换、健康检查、失败回滚。
# ============================================================================
name: deploy

on:
  workflow_call:
    inputs:
      project:
        description: "项目标识（对应服务器 projects.d/<project>.env）"
        required: true
        type: string
      web_dir:
        description: "前端源码目录（相对仓库根）"
        required: true
        type: string
      api_image:
        description: "后端镜像名；留空表示本项目没有后端镜像"
        required: false
        type: string
        default: ""
      api_dockerfile:
        description: "后端 Dockerfile 路径（相对仓库根）"
        required: false
        type: string
        default: ""
      image_context:
        description: "docker build 上下文（相对仓库根）"
        required: false
        type: string
        default: "."
      node_version:
        description: "构建前端用的 Node 版本"
        required: false
        type: string
        default: "22"
      skip_paths:
        description: "正则：命中这些路径的变更不触发发布（纯文档/纯备注时省一次构建）"
        required: false
        type: string
        default: ""
      package_manager:
        description: "前端包管理器：npm / pnpm / yarn（决定装依赖的命令和锁文件路径）"
        required: false
        type: string
        default: "npm"
    secrets:
      DEPLOY_HOST:
        required: true
        description: "服务器地址"
      DEPLOY_PORT:
        required: false
        description: "SSH 端口，默认 22"
      DEPLOY_USER:
        required: true
        description: "SSH 用户（该用户的 authorized_keys 里有受限入口）"
      DEPLOY_SSH_KEY:
        required: true
        description: "该用户的 SSH 私钥（OpenSSH 格式）"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # ── 取代码 ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 要 diff 前一个 commit，判定「是不是只改了文档」

      # ── 判断这次提交要不要发布 ────────────────────────────────────────────
      # 只改文档时不值得跑一遍构建 + 传产物 + 重启容器。
      # ⚠️ 判定逻辑放在 CI 而不是服务器：服务器上做这个判断需要先构建才知道，
      #    那样就省不掉了。
      - name: 判断是否需要发布
        id: check
        env:
          SKIP: ${{ inputs.skip_paths }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          [ -n "$SKIP" ] || exit 0
          [ -n "$BEFORE" ] || exit 0
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "首次推送，不能跳过"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" || true)"
          [ -n "$CHANGED" ] || exit 0
          if printf '%s\n' "$CHANGED" | grep -qvE "$SKIP"; then
            echo "有运行时变更，需要发布："
            printf '%s\n' "$CHANGED" | grep -vE "$SKIP" | head -20
          else
            echo "只有文档变更，跳过发布"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 构建前端 ──────────────────────────────────────────────────────────
      - name: 准备 Node
        if: steps.check.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager == 'npm' && 'npm' || inputs.package_manager }}
          cache-dependency-path: ${{ inputs.package_manager == 'pnpm' && format('{0}/pnpm-lock.yaml', inputs.web_dir) || inputs.package_manager == 'yarn' && format('{0}/yarn.lock', inputs.web_dir) || format('{0}/package-lock.json', inputs.web_dir) }}

      # ⚠️ 先查锁文件在不在 —— 少了它，setup-node 的缓存步骤会报一句
      #    莫名其妙的错，看不出是「这个项目根本没提交锁文件」。
      - name: 检查锁文件
        if: steps.check.outputs.should_deploy == 'true'
        run: |
          set -Eeuo pipefail
          case "${{ inputs.package_manager }}" in
            npm)  LOCK="${{ inputs.web_dir }}/package-lock.json" ;;
            pnpm) LOCK="${{ inputs.web_dir }}/pnpm-lock.yaml" ;;
            yarn) LOCK="${{ inputs.web_dir }}/yarn.lock" ;;
            *) echo "❌ 不支持的包管理器：${{ inputs.package_manager }}（只支持 npm / pnpm / yarn）"; exit 1 ;;
          esac
          [ -f "$LOCK" ] || { echo "❌ 找不到锁文件 $LOCK —— ${{ inputs.package_manager }} 装不了依赖"; exit 1; }
          echo "锁文件：$LOCK"

      # pnpm 的大版本跟 lockfileVersion 一一对应（v5.4→pnpm7 / v6.0→pnpm8 / v9.0→pnpm9）。
      # 用项目自己的锁文件推断版本 —— 不在 workflow 里另配一份，免得和项目脱节。
      - name: 读 pnpm 版本
        if: steps.check.outputs.should_deploy == 'true' && inputs.package_manager == 'pnpm'
        id: pnpmver
        run: |
          set -Eeuo pipefail
          LOCK="${{ inputs.web_dir }}/pnpm-lock.yaml"
          MAJOR="$(head -1 "$LOCK" | grep -oE '[0-9]+' | head -1)"
          case "$MAJOR" in
            5) VER=7 ;;
            6) VER=8 ;;
            9) VER=9 ;;
            *) echo "❌ 认不出的 lockfileVersion：$MAJOR（$LOCK）"; exit 1 ;;
          esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "pnpm $VER（lockfileVersion $MAJOR）"

      - name: 安装 pnpm
        if: steps.check.outputs.should_deploy == 'true' && inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpmver.outputs.version }}

      - name: 安装前端依赖
        if: steps.check.outputs.should_deploy == 'true'
        working-directory: ${{ inputs.web_dir }}
        run: |
          set -Eeuo pipefail
          case "${{ inputs.package_manager }}" in
            npm)  npm ci --no-audit --no-fund ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            *) echo "❌ 不支持的包管理器：${{ inputs.package_manager }}"; exit 1 ;;
          esac

      - name: 构建前端
        if: steps.check.outputs.should_deploy == 'true'
        working-directory: ${{ inputs.web_dir }}
        run: npm run build

      - name: 打包前端产物
        if: steps.check.outputs.should_deploy == 'true'
        run: |
          set -Eeuo pipefail
          SRC="${{ inputs.web_dir }}/dist"
          [ -f "$SRC/index.html" ] || { echo "❌ $SRC 里没有 index.html，前端构建没成功"; exit 1; }
          tar -czf "$RUNNER_TEMP/web-dist.tar.gz" -C "$SRC" .
          echo "前端产物：$(du -h "$RUNNER_TEMP/web-dist.tar.gz" | cut -f1)"

      # ── 构建后端镜像 ──────────────────────────────────────────────────────
      - name: 构建后端镜像
        # ⚠️ 同一个 step 只能有一个 if：两条 if 会被 GitHub 判成 "if is already defined"，
        #    整个 workflow 直接解析失败（2026-10-28 踩过）
        if: steps.check.outputs.should_deploy == 'true' && inputs.api_image != ''
        run: |
          set -Eeuo pipefail
          docker build \
            -f "${{ inputs.api_dockerfile }}" \
            -t "${{ inputs.api_image }}:${{ github.sha }}" \
            "${{ inputs.image_context }}"
          docker save "${{ inputs.api_image }}:${{ github.sha }}" | gzip > "$RUNNER_TEMP/api-image.tar.gz"
          echo "镜像产物：$(du -h "$RUNNER_TEMP/api-image.tar.gz" | cut -f1)"

      # ── 配置 SSH ──────────────────────────────────────────────────────────
      - name: 配置 SSH 密钥
        if: steps.check.outputs.should_deploy == 'true'
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # ── 上传产物 ──────────────────────────────────────────────────────────
      # 产物落地目录由服务器自己报（incoming-dir），避免 CI 和服务器各写一份路径
      - name: 上传产物到服务器
        if: steps.check.outputs.should_deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          SSH=(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          SCP=(scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

          ARTIFACT_DIR="$("${SSH[@]}" "$TARGET" "incoming-dir ${{ inputs.project }}" | tail -1)"
          [ -n "$ARTIFACT_DIR" ] || { echo "❌ 拿不到产物目录"; exit 1; }
          echo "产物目录：$ARTIFACT_DIR"

          "${SCP[@]}" "$RUNNER_TEMP/web-dist.tar.gz" \
            "${TARGET}:${ARTIFACT_DIR}/${SHA}.web-dist.tar.gz"
          if [ -f "$RUNNER_TEMP/api-image.tar.gz" ]; then
            "${SCP[@]}" "$RUNNER_TEMP/api-image.tar.gz" \
              "${TARGET}:${ARTIFACT_DIR}/${SHA}.api-image.tar.gz"
          fi

      # ── 触发服务器原子发布 ────────────────────────────────────────────────
      - name: 触发发布
        if: steps.check.outputs.should_deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          # 服务器上可能有另一个发布占着锁 → 重试几次再放弃
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key -p "$PORT" \
              -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" "apply ${{ inputs.project }} ${SHA}"; then
              exit 0
            fi
            echo "第 ${i} 次触发失败，10 秒后重试"
            sleep 10
          done
          echo "❌ 重试 5 次仍未发布成功"
          exit 1
